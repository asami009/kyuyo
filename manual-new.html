<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>給与計算ツール 取扱説明書</title>
<style>
/* ============================================================
   取扱説明書（v10.7 対応・2026-08-18）
   ★スマホで見ながらPCで操作する前提。だから：
     ・文字は16px以上（iOSは16px未満の入力欄で勝手に拡大される）
     ・タップできるものは高さ44px以上
     ・上の検索窓は貼り付いたまま（スクロールしても消えない）
     ・開いた項目は開いたまま。検索しても勝手に閉じない
   ============================================================ */
:root{
  --bg:#f6f4f1; --card:#fff; --ink:#1d1b19; --sub:#6d6764;
  --line:#e2ddd7; --accent:#8a5a3b; --accent-bg:#f3e9e1;
  --warn-bg:#fff6e0; --warn-line:#e8c877;
  --ng-bg:#fdeceb; --ng-line:#e9a9a4;
  --ok-bg:#eaf4ec; --ok-line:#a6cdb0;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#191715; --card:#232019; --ink:#f0ece7; --sub:#a9a29c;
    --line:#3a352e; --accent:#e0a878; --accent-bg:#33291f;
    --warn-bg:#332a12; --warn-line:#7a6428;
    --ng-bg:#3a1f1d; --ng-line:#8a4a45;
    --ok-bg:#1e2f22; --ok-line:#47764f;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-size:16px; line-height:1.75;
  -webkit-text-size-adjust:100%;
  padding:0 0 60px;
}
.wrap{max-width:760px; margin:0 auto; padding:0 14px}

/* ---------- 見出し ---------- */
header{
  background:var(--accent-bg); border-bottom:1px solid var(--line);
  padding:18px 0 14px;
}
h1{font-size:21px; margin:0 0 4px; letter-spacing:.01em}
header .lead{font-size:14px; color:var(--sub); margin:0}

/* ---------- 検索（貼り付く） ---------- */
.searchbar{
  position:sticky; top:0; z-index:20;
  background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 0 9px;
}
.searchbar .wrap{display:flex; gap:8px; align-items:center}
#q{
  flex:1 1 auto; min-width:0;
  font-size:17px;               /* ★16px未満にしないこと（iOSが拡大する） */
  padding:12px 14px; height:48px;
  border:1.5px solid var(--line); border-radius:12px;
  background:var(--card); color:var(--ink);
  font-family:inherit;
}
#q:focus{outline:none; border-color:var(--accent)}
#clear{
  flex:0 0 auto; height:48px; min-width:48px; padding:0 14px;
  border:1.5px solid var(--line); border-radius:12px;
  background:var(--card); color:var(--sub);
  font-size:16px; font-family:inherit; cursor:pointer;
}
#hit{font-size:13px; color:var(--sub); padding:6px 0 0}

/* ---------- 分類チップ ---------- */
.cats{display:flex; gap:7px; overflow-x:auto; padding:11px 0 3px; -webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; height:40px; padding:0 15px;
  border:1.5px solid var(--line); border-radius:20px;
  background:var(--card); color:var(--ink);
  font-size:14px; font-family:inherit; cursor:pointer; white-space:nowrap;
}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff}

/* ---------- 項目 ---------- */
.item{
  background:var(--card); border:1px solid var(--line); border-radius:13px;
  margin:9px 0; overflow:hidden;
}
.item > .head{
  display:flex; gap:10px; align-items:center;
  width:100%; min-height:56px; padding:12px 14px;
  background:none; border:0; text-align:left;
  color:var(--ink); font-size:16px; font-weight:600; font-family:inherit;
  cursor:pointer; line-height:1.5;
}
.item > .head .arw{
  flex:0 0 auto; margin-left:auto; color:var(--sub); font-size:13px;
  transition:transform .15s;
}
.item.open > .head .arw{transform:rotate(90deg)}
.item > .head:active{background:var(--accent-bg)}
.item .body{display:none; padding:2px 14px 16px; font-size:15.5px}
.item.open .body{display:block}
.item .cat{
  display:inline-block; font-size:11px; font-weight:600; color:var(--accent);
  background:var(--accent-bg); border-radius:5px; padding:1px 7px; margin-right:2px;
}
.item .body p{margin:9px 0}
.item .body ul,.item .body ol{margin:9px 0; padding-left:1.35em}
.item .body li{margin:5px 0}
.item .body b{color:var(--ink)}
.step{counter-reset:st; list-style:none; padding-left:0 !important}
.step > li{
  counter-increment:st; position:relative; padding-left:34px; margin:11px 0 !important;
}
.step > li::before{
  content:counter(st); position:absolute; left:0; top:2px;
  width:24px; height:24px; border-radius:50%;
  background:var(--accent); color:#fff;
  font-size:13px; font-weight:700; text-align:center; line-height:24px;
}
.note{border-radius:10px; padding:11px 13px; margin:11px 0; font-size:14.5px; line-height:1.7}
.note.warn{background:var(--warn-bg); border:1px solid var(--warn-line)}
.note.ng  {background:var(--ng-bg);   border:1px solid var(--ng-line)}
.note.ok  {background:var(--ok-bg);   border:1px solid var(--ok-line)}
kbd{
  background:var(--accent-bg); border:1px solid var(--line); border-radius:5px;
  padding:1px 6px; font-size:13.5px; font-family:inherit; white-space:nowrap;
}
.empty{padding:30px 4px; color:var(--sub); text-align:center; font-size:15px}
footer{margin-top:26px; padding-top:14px; border-top:1px solid var(--line); color:var(--sub); font-size:13px}
mark{background:#ffe9a8; color:#1d1b19; border-radius:3px; padding:0 1px}
@media (prefers-color-scheme: dark){ mark{background:#7a6428; color:#fff} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>給与計算ツール　取扱説明書</h1>
    <p class="lead">知りたいことを検索窓に打つと、その項目だけ出ます。<br>
      例）<b>締め</b>／<b>原価</b>／<b>ボーナス</b>／<b>明細</b>／<b>間違えた</b></p>
  </div>
</header>

<div class="searchbar">
  <div class="wrap">
    <input id="q" type="search" placeholder="検索（例：締め、原価、間違えた）"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <button id="clear" type="button">✕</button>
  </div>
  <div class="wrap"><div id="hit"></div></div>
</div>

<div class="wrap">
  <div class="cats" id="cats"></div>
  <div id="list"></div>
  <footer>
    給与計算ツール v10.7 対応　最終更新 2026-08-18<br>
    書いてないこと・分からないことが出たら、そのまま聞いてください。ここに足します。
  </footer>
</div>

<script>
"use strict";
/* ============================================================
   項目データ。cat＝分類、t＝見出し、k＝検索用の別の言い方、h＝本文
   ★k（別の言い方）が検索の当たり具合を決める。
     見出しに無い言葉でも探せるように、現場で使いそうな言い方を入れてある。
   ============================================================ */
const ITEMS = [

/* ---------------- はじめに ---------------- */
{cat:"はじめに", t:"これは何をする道具？", k:"概要 なにができる 全体 ざっくり はじめて 初めて",
 h:`<p>伝票と出勤時間を打つと、<b>キャストさんの給料を計算して、給与明細と出勤表を出す</b>道具です。</p>
 <ul>
   <li>紙の伝票1枚 ＝ この道具の伝票1件</li>
   <li>締めは<b>月2回</b>：前期（1〜15日）／後期（16〜末日）</li>
   <li><b>金額の出し方は紙と同じ</b>（紙でやっていた計算をそのまま置き換えたもの）</li>
 </ul>
 <div class="note ok"><b>安心してください。</b>
 <ul>
   <li>打った内容は<b>この端末のブラウザの中</b>に保存。どこかに送られることはありません</li>
   <li>間違えても、ほとんどのことはやり直せます</li>
 </ul></div>`},

{cat:"はじめに", t:"はじめて使うとき：最初の一周", k:"はじめて 初めて 最初 まず どこから 使い方 一周 試す お試し サンプル 練習",
 h:`<p><b>まず1日ぶんだけ</b>、この4つで一周してみてください。</p>
 <ol class="step">
   <li><b>⑤設定</b>タブでキャストを登録（伝票に書かれる呼び名のまま）</li>
   <li><b>①伝票入力</b>で伝票を1枚打つ<br>
       <kbd>＋ 新しい伝票</kbd> → 人数・係 → <kbd>＋ 行を追加</kbd>で中身を入れる → 一番下で現金かカード</li>
   <li><b>②出勤時間</b>で出勤・退勤を入れる（<b>20:00</b> / <b>1:00</b> の形。深夜はそのまま <b>1:00</b>）</li>
   <li><b>④締め・給与</b>で金額を見る → <kbd>📄 給与明細を発行</kbd>で明細が出ます</li>
 </ol>
 <div class="note ok"><b>打たずに動きだけ見たいとき：</b>
 ⑤設定タブの一番下<kbd>サンプル伝票を読み込む</kbd>を押す。
 実際の伝票2枚が入り、そのまま④タブで金額を見られます。<br>
 試したあとに消すときは、<b>⑦カレンダーで2026年7月30日</b>を押して、
  伝票カードの<kbd>直す</kbd>から削除してください。</div>
 <div class="note warn"><b>いきなり締めなくて大丈夫。</b>
 「締める」は金額を確定させる操作なので、慣れてから。
 締めても<b>あとから解除できます</b>。</div>`},

{cat:"はじめに", t:"試すだけなら何をしても大丈夫？", k:"試す 練習 壊れる 怖い 適当 消す 元に戻す テスト 触っていい",
 h:`<p><b>大丈夫です。</b>書き換わるのは<b>いま開いている端末のブラウザの中</b>だけ。
 お店の他のシステムやお金の記録には一切つながっていません。</p>
 <ul>
   <li>適当な伝票を打っても、その伝票を消せば元に戻ります</li>
   <li>金額が確定するのは<b>「締める」を押したときだけ</b>。それも解除できます</li>
   <li>他の人の画面には何も出ません（送信されないため）</li>
 </ul>
 <div class="note warn">気をつけるのは1つだけ。<b>本番で使い始めてから</b>は、
 ⑤設定の<kbd>単価マスタを最初の状態に戻す</kbd>を押さない
 （設定が初期に戻ります。打った伝票は消えませんが、入れ直しが要ります）。</div>`},

{cat:"はじめに", t:"タブは7つ。どれを使う？", k:"タブ 画面 メニュー どこ ①②③④⑤⑥⑦ 番号 カレンダー",
 h:`<p>毎日やるのは<b>①と②だけ</b>です。</p>
 <ul>
   <li><b>① 伝票入力</b>　… 伝票を<b>打つ</b>。<b>毎日ここ</b>（打ち終わった伝票を見るのは⑦）</li>
   <li><b>② 出勤時間</b>　… 出勤・退勤の時刻を入れる。<b>毎日ここ</b></li>
   <li><b>③ ボトル原価</b>　… 出たボトルの仕入れ値を入れる（この担当は別の人でもOK）</li>
   <li><b>④ 締め・給与</b>　… 金額を見る。締める。給与明細を出す</li>
   <li><b>⑤ 設定</b>　… キャスト登録・単価・ボーナス・丸め</li>
   <li><b>⑥ 検算</b>　… 計算が仕様どおりか、道具が自分で検査（ふだんは触らなくてOK）</li>
   <li><b>⑦ カレンダー</b>　… その月をひと目で見る。<b>打ち終わった伝票を見る・直すのはここから</b></li>
 </ul>`},

{cat:"はじめに", t:"データはどこに保存される？消えない？", k:"保存 データ 消える バックアップ 移す 端末 別のパソコン 引っ越し",
 h:`<p>保存先は<b>いま使っているブラウザの中</b>。閉じても残ります。</p>
 <div class="note warn"><b>消えることがある場面：</b>
 <ul><li>ブラウザの「履歴とデータを消去」をした</li>
 <li>シークレットウィンドウ（プライベートモード）で使った</li>
 <li>別のパソコン・別のブラウザで開いた（そこには何も無い状態から始まります）</li></ul></div>
 <p><b>控えの取り方：</b></p>
 <ol class="step">
   <li>⑤設定の一番下「データの書き出し・取り込み」を開く</li>
   <li><kbd>書き出す（自分の別の端末に移す用・原価も入る）</kbd>を押す → 出てきた文字の塊をメモに貼って保存</li>
   <li>戻すときは、同じ場所の<kbd>取り込む</kbd>に貼り付ける</li>
 </ol>
 <div class="note ok">月に1回、締めたあとに控えを取っておくと安心です。</div>`},

/* ---------------- 毎日やること ---------------- */
{cat:"毎日やること", t:"伝票を打つ（①伝票入力）", k:"入力 打つ 伝票 新しい 追加 セット ドリンク ボトル 会計 客 人数 係 枚数 何枚 一番下 下のボタン 入力完了 手順",
 h:`<div class="note"><b>①は「打つだけ」の画面です。</b>打ち終わった伝票はここには並びません。
 <b>見る・直すのは⑦カレンダー</b>から、その日を押して。</div>
 <ol class="step">
   <li>上の<b>「表示する日」</b>をその日の日付にする</li>
   <li><kbd>＋ 新しい伝票</kbd>を押す</li>
   <li><b>伝票No.・人数（◯名様）・係のキャスト</b>を入れる<br>
       （紙のお会計票の<b>上の行</b>と<b>下の枠（名様・係）</b>にあたります）</li>
   <li>下のブロックで<kbd>＋ 行を追加</kbd> → <b>紙の「品名」の欄を上から順に写す</b><br>
       （セット／<b>同伴</b>／ボトル／キャストドリンク／その他（テキーラ・ソフトドリンクなど）／調整）</li>
   <li><b>現金かカード</b>は<b>会計のところ</b>（一番下）で選びます<br>
       （紙でも、お客様名のすぐ下に最終の金額が来ます）</li>
   <li>打ち終わったら、会計の下の<kbd>✓ 入力完了</kbd>。画面が空に戻り、次の伝票が打てます<br>
       （続けて打つときは<kbd>＋ 続けて新しい伝票</kbd>でもOK）</li>
 </ol>
 <ul>
   <li>打つたびに<b>その場で自動保存</b>。「保存」ボタンはありません</li>
   <li>上の<b>「8月5日（水）　伝票 3 枚　総売上 ◯◯円」</b>で、いま何日・何枚かを確認できます</li>
 </ul>
 <div class="note warn"><b>係を空にすると、誘客も売上も誰にも付きません。</b>
 フリーのお客様のときはそれで正しいです。付けたいときは必ず係を選ぶ。</div>`},

{cat:"毎日やること", t:"出勤時間を入れる（②出勤時間）", k:"出勤 退勤 時間 時刻 勤務 時給 深夜 翌日 またぐ 26時 名前が出ない 送迎 控除 日払い",
 h:`<p>日付を選ぶと、<b>その日の伝票に名前が出てきた人が自動で並びます。</b>出勤・退勤を打つだけ。</p>
 <ul>
   <li>書き方は <b>20:00</b> / <b>1:30</b>（「2000」「130」でも同じに直ります）</li>
   <li>深夜の退勤は <b>1:00</b> とそのまま書けば翌日として計算（<b>26:00</b>という書き方もOK）</li>
   <li>時給は<b>30分単位で切り捨て</b>（5時間20分なら5時間ぶん）</li>
 </ul>
 <div class="note warn"><b>伝票に名前が出ない人</b>（誘客もドリンクも無かった人）は自動で並びません。<br>
 →「ここにいない人を追加」から選んで足す。<br>
 ★忘れると<b>その人の時給がまるごと0円</b>に。締めるときに検査で止まります。</div>
 <div class="note ok"><b>送迎費・その他控除・日払い</b>も、この画面の同じ行で入れます。
 →「送迎費・その他控除・日払いを入れる」の項目へ。</div>`},

{cat:"毎日やること", t:"紙のお会計票と画面の対応（新しい人に教えるとき）", k:"紙 伝票 お会計票 対応 どこ 教える 新人 はじめて 見ながら 写す 場所 並び",
 h:`<p><b>画面は紙のお会計票と同じ順番に並べてあります。</b>上から順に写せます。</p>
 <table style="width:100%;border-collapse:collapse;font-size:13px">
 <tr><th style="text-align:left;padding:4px">紙のどこ</th><th style="text-align:left;padding:4px">画面のどこ</th></tr>
 <tr><td style="padding:4px">日付・No.（一番上）</td><td style="padding:4px">伝票の<b>日付・伝票№</b></td></tr>
 <tr><td style="padding:4px">下の枠の<b>◯名様</b></td><td style="padding:4px"><b>人数（◯名様）</b></td></tr>
 <tr><td style="padding:4px">下の枠の<b>係</b></td><td style="padding:4px"><b>係（呼んだキャスト）</b></td></tr>
 <tr><td style="padding:4px"><b>品名</b>の欄（明細）</td><td style="padding:4px"><b>明細</b>のブロック（下の表）</td></tr>
 <tr><td style="padding:4px">お客様名のところ</td><td style="padding:4px"><b>会計の「支払い」</b>（現金／カード）</td></tr>
 <tr><td style="padding:4px">一番下の<b>税込合計金額</b></td><td style="padding:4px"><b>お会計</b></td></tr>
 </table>
 <p><b>紙の「品名」に書かれるもの → 画面のどのブロックか</b></p>
 <ul>
   <li><b>20:56〜21:56</b> のような<b>時刻</b> → <b>セット</b>（時間ぶんの本数を入れます）</li>
   <li><b>キャストの名前だけ</b>が書かれた行 → <b>キャストドリンク</b></li>
   <li><b>オリシャン</b> などの<b>銘柄</b> → <b>ボトル</b></li>
   <li><b>テキーラ（◯◯）</b> のような<b>品名＋カッコ書き</b> → <b>その他</b>（キャスト欄に名前を入れる）</li>
   <li><b>タンサン</b> など → <b>その他</b></li>
   <li><b>同伴</b> → 明細の<b>同伴</b>（セットの下）</li>
 </ul>
 <div class="note warn"><b>時刻が書いてあるだけの行が「セット」だと分かるのは、現場を知っている人だけです。</b>
 新しい人には、まずこの表を見せてください。</div>
 <div class="note ok"><b>テーブル番号とお客様名は打ちません。</b>給料の計算に関係しないためです。</div>`},

{cat:"毎日やること", t:"送迎費・その他控除・日払いを入れる（②出勤時間）", k:"送迎 送り 迎え 送迎費 控除 引く 引かれる 天引き 日払い 前払い 立替 罰金 制服代 差引 渡す額 マイナス",
 h:`<p><b>②出勤時間</b>タブ。人の行の下に3つの欄があります。</p>
 <ul>
   <li><b>送迎</b>…印を付けると <b>500円</b> が入ります。<b>距離で変わる日は、その数字を直す</b></li>
   <li><b>その他控除</b>…金額と<b>理由</b>（制服代・備品代など）。理由は明細にも出ます</li>
   <li><b>日払い</b>…<b>その日にもう渡したお金</b></li>
 </ul>
 <p>右端に、その人のその日の金額がすぐ出ます。</p>
 <ul>
   <li><b>日当</b>＝時給分＋バック＋ボーナス −（送迎＋その他控除）</li>
   <li><b>差引</b>＝日当 − 日払い　＝<b>これから渡す額</b></li>
 </ul>
 <div class="note ok"><b>使わない日は何もしなくて大丈夫。</b>
 空のままなら金額はいままで通りです。</div>
 <div class="note warn"><b>差引は赤いマイナスになることがあります。</b>
 日払いのほうが多かった日です。異常ではありません。<b>月の合計で相殺されます</b>。</div>
 <div class="note warn"><b>締めたあとは直せません。</b>
 送迎・控除・日払いも、締めると触れなくなります。直すときは④で締めを解除してください。</div>`},

{cat:"毎日やること", t:"ボトル原価を入れる（③ボトル原価）", k:"原価 仕入れ 仕入値 ボトル バック 焼き付け 期間 未入力",
 h:`<p>出たボトルの<b>仕入れ値</b>を入れる場所です。</p>
 <ul>
   <li>ボトルのバック ＝ <b>（売値 − 原価）× 20%</b></li>
   <li>原価が入っていないと、そのボトルのバックは<b>0円</b>になります</li>
 </ul>
 <ol class="step">
   <li>上の<b>期間</b>を、原価を確定させたい期間にする（例：8/1〜8/15）</li>
   <li>その期間の伝票に出た銘柄だけが並ぶ → 仕入れ値を入れる</li>
 </ol>
 <div class="note warn"><b>★期間を先に選ぶのが大事。</b>
 同じ銘柄でも<b>都度仕入れる</b>ので値段が変わります。
 期間を選んで入れると<b>その期間のボトルにだけ焼き付く</b>ので、
 次の月に別の値段を入れても前の月の給料は動きません。</div>
 <p>打ち間違えたら：<b>同じ期間を出して入れ直す</b>だけ（欄を空にすると未入力に戻ります）。</p>`},

/* ---------------- 締め ---------------- */
{cat:"毎日やること", t:"「入力完了」を押すと、打った内容は消えませんか？", k:"入力完了 完了 消える 保存 セーブ 保存されない 消えた 無くなる 心配 大丈夫 押していい ボタン",
 h:`<p><b>消えません。</b>「入力完了」は<b>保存ボタンではなく、閉じるボタン</b>です。</p>
 <ul>
   <li>この道具は<b>欄に1文字打つたびに、そのつど保存</b>。押す前に保存は終わっています</li>
   <li>押して消えるのは「いまどの伝票を開いているか」だけ。伝票そのものには触っていません</li>
   <li>押したあと、緑色で<b>「✓ 8月5日（水）　No.1　お会計 ◯◯円　を保存しました」</b>と出ます。これが出ていれば入っています</li>
   <li>ページを閉じても、パソコンを切っても残ります</li>
 </ul>
 <p><b>打った伝票を見たいときは⑦カレンダー</b>で、その日を押す。伝票が明細ごと並びます。</p>
 <div class="note">消えるのはブラウザのデータを消したときだけです（「データはどこに保存される？」の項目を見てください）。</div>`},

{cat:"毎日やること", t:"カレンダーで月ぜんぶを見る（⑦カレンダー）", k:"カレンダー 月 一覧 見渡す 日別 その日 総売上 売上 人件費 いくら 探す 過去 何日 暦 月表示 先月 来月 直す 編集 見る 伝票を見る",
 h:`<p><b>打ち終わった伝票を見る・直すのは、ここが入口です</b>（①は「打つだけ」の画面なので並びません）。</p>
 <p>⑦を開くと、その月のカレンダーが出ます。</p>
 <ul>
   <li>伝票を打った日 … その日の<b>総売上</b>と<b>伝票の枚数</b></li>
   <li>一番上 … その月の<b>総売上・伝票の枚数・営業した日数</b></li>
   <li><kbd>◀ 前の月</kbd><kbd>次の月 ▶</kbd>で月を移動（年をまたいでも大丈夫）</li>
 </ul>
 <p><b>日を押すと、下にその日の中身が出ます</b>（もう一度押すと閉じます）。</p>
 <ul>
   <li>総売上・伝票の枚数・<b>人件費（その日の日当の合計）</b></li>
   <li>その日の<b>伝票が、伝票の形のカードで横に4枚ずつ</b>並ぶ。セット・ボトル・ドリンクなど<b>中身もそのまま読めます</b></li>
   <li>伝票を直したい → カードの<kbd>直す</kbd>を押すと①伝票入力で開く</li>
   <li><b>人件費の内訳</b>（誰にいくら。時給分・バック・ボーナス・日当）</li>
   <li>その日の伝票を打ちたい → 右上の<kbd>＋ 伝票を追加</kbd>で①がその日付で開く（伝票がまだ無い日も押せます）</li>
 </ul>
 <div class="note"><b>🔒 が付いている日は締め済みです。</b>
 金額は<b>締めたときのまま</b>で、あとから時給や原価を直しても動きません。</div>
 <div class="note">金額は④締め・給与とまったく同じ計算です。
 カレンダーの上で数字は書き換えられません（直すのは<kbd>直す</kbd>から①で）。</div>`},

{cat:"締め", t:"締めるとどうなる？（一番大事）", k:"締め 締める ロック 固定 動かない 確定 lock 変わる",
 h:`<p>締めると、<b>その期間の金額がそこで固定されます。</b>
 あとから原価・丸め・ボーナスを直しても、<b>締めた期間の給料は1円も動きません。</b></p>
 <p>あわせて、こうなります：</p>
 <ul>
   <li>その期間の<b>伝票が編集できなくなる</b>（見るのはできます。一覧に🔒が出ます）</li>
   <li>その期間の日付で<b>新しい伝票を作れなくなる</b></li>
   <li>その期間の<b>出勤時間が触れなくなる</b></li>
   <li>③原価・⑤設定は触れます。ただし<b>締めた期間には効きません</b>（画面にもそう出ます）</li>
 </ul>
 <p>あとから<b>解除できます</b>（「締めを解除して直す」の項目を見てください）。</p>
 <div class="note ok"><b>なぜこれが必要か：</b>
 原価を入れる人と締める人が別だからです。締めて振り込んだあとに誰かが原価を入れると、
 <b>渡した金額と画面の金額が違う</b>ことになってしまいます。締めるとそれが起きません。</div>`},

{cat:"締め", t:"締めるやり方（手順）", k:"締め方 手順 やり方 前期 後期 締める 押す ボタン",
 h:`<ol class="step">
   <li><b>④締め・給与</b>タブを開く</li>
   <li>上の<b>「締め（年月）」</b>と<b>「前期／後期」</b>を選ぶ</li>
   <li><kbd>この締めで出す</kbd>を押す</li>
   <li>一番上に出る<kbd>🔒 この期間を締める</kbd>を押す</li>
   <li>検査が走る。<b>引っかかったら理由が赤で出る</b>ので、直してもう一度押す</li>
   <li>金額と人数の確認が出る → 合っていたら<b>OK</b></li>
 </ol>
 <div class="note warn"><b>締められるのは前期・後期まるごとだけ。</b>
 「1日〜10日」のような半端な期間では締めるボタンが出ません。
 かならず<kbd>この締めで出す</kbd>で期間を出してください。</div>`},

{cat:"締め", t:"「まだ締められません」と出た", k:"締められない 赤 エラー 止まる 検査 引っかかる できない",
 h:`<p>締める前の検査で止まっています（<b>あとから直すと渡した額と合わなくなるもの</b>が残っている状態）。
 出た理由ごとに直してください。</p>
 <ul>
   <li><b>原価が未入力のボトルがあります</b><br>
       → ③ボトル原価タブで入れる。<b>そのボトルのバックが0円で計算されています</b></li>
   <li><b>出勤・退勤の時刻が空の人があります</b><br>
       → ②出勤時間タブで入れる。<b>その人の時給分が0円になっています</b></li>
   <li><b>確認したいところが残っています</b><br>
       → ④タブの「確認したいところ」に出ている内容を直す（分割の合計が売値と合わない等）</li>
   <li><b>ボーナスの段（ラダー）が入っていません</b><br>
       → ⑤設定で段を入れる。ボーナスを使わないなら「もらう人」を空にする</li>
   <li><b>この期間は前期・後期ぴったりではありません</b><br>
       → 上の「締め（年月）」「前期／後期」を選んで<kbd>この締めで出す</kbd>を押す</li>
   <li><b>この期間には伝票が1枚もありません</b><br>
       → 期間の選び間違いです。年月と前期／後期を確認してください</li>
 </ul>
 <div class="note ok">この検査は<b>邪魔をしているのではなく、間違った金額で締めるのを止めています。</b>
 全部直してから締めれば、その金額はもう動きません。</div>`},

{cat:"締め", t:"締めを解除して直す", k:"解除 やり直し 直したい 戻す 間違えて締めた 打ち間違い ロック解除",
 h:`<p>締めたあとに間違いが見つかったら、解除して直せます。</p>
 <ol class="step">
   <li><b>④締め・給与</b>タブで、その期間を出す（年月＋前期／後期 → <kbd>この締めで出す</kbd>）</li>
   <li><kbd>🔓 締めを解除</kbd>を押す</li>
   <li>期間名と締めたときの合計が出る → 合っていたら<b>OK</b></li>
   <li>伝票・出勤時間が触れるようになるので、直す</li>
   <li>直したら<b>もう一度締める</b></li>
 </ol>
 <div class="note ok"><b>締めたときの金額は控えとして残ります。</b>
 締め直すと「前に締めたとき ◯◯円 → 今回 ◯◯円（差 ±◯◯円）」と画面に出るので、
 <b>いくら変わったかが分かります</b>。振込の差額を出すときに使ってください。</div>
 <div class="note warn">解除している間は、その期間の金額が<b>いまの設定で計算し直されます</b>。
 直し終わったら必ず締め直してください。</div>`},

{cat:"締め", t:"「控えと計算が合っていません」と赤で出た", k:"合っていません 赤 ズレ 不具合 バグ 違う 控え",
 h:`<div class="note ng"><b>これはこの道具の不具合です。あなたの操作ミスではありません。</b><br>
 <b>締めた額（画面の上に出ている合計）が正しいので、そのまま払ってください。</b></div>
 <p>そのあと、この画面を写真に撮って作った人に送ってください。
 何を触ったあとに出たかも一緒に伝えてもらえると早く直せます。</p>`},

/* ---------------- 給与明細・出勤表 ---------------- */
{cat:"出す・印刷", t:"給与明細を出す・印刷する", k:"明細 給与明細 印刷 PDF 出す 発行 渡す 紙",
 h:`<ol class="step">
   <li><b>④締め・給与</b>タブで期間を出す</li>
   <li>その人のカードの<kbd>📄 給与明細を発行</kbd>を押す</li>
   <li><kbd>🖨 印刷</kbd>を押す</li>
 </ol>
 <ul>
   <li>PDFで保存 → 印刷の画面で<b>送信先を「PDFに保存」</b>。ファイル名は<b>「7月前期_ママ」</b>のような形</li>
   <li>出勤表（横長の紙の様式）も同じところから。<b>印刷は自動で横向き</b>になります</li>
 </ul>`},

{cat:"出す・印刷", t:"金額の内訳を見る", k:"内訳 なんでこの金額 計算 確認 表 合計 バック 時給",
 h:`<p>④締め・給与タブの<b>「内訳」</b>の表に、1人ずつ全部出ています。</p>
 <ul>
   <li><b>勤務(実)</b>／<b>30分切捨</b>／<b>時給分</b></li>
   <li><b>誘客</b>（人数×500円）／<b>キャスドリ</b>／<b>テキーラ</b>／<b>同伴</b>／<b>ボトル</b></li>
   <li><b>バック計</b>（上の5つの合計）</li>
   <li><b>ボーナス</b>（段が入っているときだけ列が出ます）</li>
   <li><b>給料</b>（時給分＋バック計＋ボーナス を日ごとに丸めたもの）</li>
 </ul>
 <p><b>送迎・その他控除・日払いを入れた期間は、列が増えます。</b></p>
 <ul>
   <li><b>送迎</b>／<b>他控除</b>（引くもの。頭に − が付きます）</li>
   <li><b>日当</b>（＝上の「給料」から送迎と他控除を引いたあと）</li>
   <li><b>日払い</b>（その日にもう渡したお金）</li>
   <li><b>差引</b>＝<b>これから渡す額</b>。<b>赤いマイナス</b>は渡しすぎた月です</li>
 </ul>
 <div class="note ok">一番上の<b>「支給額」のカードと「支給 合計」は、差引（渡す額）</b>が出ています。
 日払いを引いたあとの額なので、<b>その金額をそのまま渡せます</b>。</div>`},

{cat:"出す・印刷", t:"個人売上と対比（＝売上に対する人件費）", k:"個人売上 売上 対比 人件費 人件費率 率 パーセント ％ 税込 税抜 小計 1.1 消費税 税 誰の売上 誰につく 少ない 合わない 参考 確認中",
 h:`<p>④締め・給与タブの<b>「売上（参考）」</b>と、<b>給与明細の紙</b>に出ています。</p>
 <div class="note ok"><b>個人売上も対比も、お給料の金額には効きません。</b>
 見るための数字です（日当は時給分＋バックから計算していて、売上は使っていません）。</div>

 <p><b>誰の売上として数えるか</b></p>
 <ul>
   <li><b>セット</b> … 伝票の<b>係</b>（呼んだキャスト）につきます</li>
   <li><b>ボトル</b> … 係。<b>分割</b>を入れていれば、その金額の比で分けます</li>
   <li><b>キャストドリンク</b> … <b>飲んだキャスト</b>につきます</li>
   <li><b>その他（テキーラなど）</b> … <b>キャスト欄に名前が入っている分だけ</b>。空＝お客用は誰にもつきません</li>
   <li>係が<b>フリー・案内所</b>の伝票は、セットとボトルの売上が<b>誰にもつきません</b></li>
 </ul>

 <p><b>税込です（明細の合計 × 1.1）</b></p>
 <table style="border-collapse:collapse;font-size:13px">
   <tr><th style="padding:4px;text-align:left">伝票の「小計」</th><td style="padding:4px">税抜</td></tr>
   <tr><th style="padding:4px;text-align:left">個人売上・対比</th><td style="padding:4px"><b>税込</b>（小計 × 1.1）</td></tr>
 </table>
 <div class="note warn"><b>伝票の小計を足しても、個人売上とは額が合いません。</b>基準が違うためです。
 例：明細が 23,500円（税抜）→ 個人売上は <b>25,850円</b>。<br>
 <b>お会計の金額とも違います。</b>お会計は100円単位に切り上げますが、個人売上は切り上げません。<br>
 <b>カード払いの伝票も ×1.1 です</b>（カードの上乗せは手数料なので売上に数えません）。</div>

 <p><b>対比</b>＝ 日当の合計 ÷ 個人売上（税込）。売上に対して人件費がどれくらいか、という割合です。</p>
 <div class="note">個人売上と対比には<b>「※確認中」</b>と出ています。
 <b>数え方をお店に確認中</b>のため、いまは参考値として見てください。</div>`},

/* ---------------- 設定 ---------------- */
{cat:"設定", t:"キャストを登録する・名前を直す", k:"キャスト 登録 追加 名前 変更 改名 削除 やめた 新しい子 源氏名",
 h:`<p><b>⑤設定</b>タブの「キャスト登録」から。名前は<b>伝票に書かれる呼び名のまま</b>入れてください。</p>
 <ul>
   <li><kbd>↑</kbd>で並び順を変更（伝票の選択肢の順番になります）</li>
   <li>削除は、その人の記録が残っているときは確認が出ます</li>
   <li>②出勤時間タブの「＋ 新しい人を登録」からも足せます（ここの一覧にも入ります）</li>
 </ul>
 <div class="note warn"><b>名前を直したとき、過去の記録は前の名前のまま残ります</b>
 （源氏名が変わっても、前の名前のときの売上を残せる作り）。
 <ul>
   <li>締めると<b>前の名前と新しい名前が別の人として2行に並びます</b></li>
   <li><b>時給は新しい名前に引き継がれます</b>（前の名前の時給も残ります）</li>
   <li>打ち間違いを直したいだけのときは、押す前に出る「記録◯か所で使われています」をよく見る</li>
 </ul></div>`},

{cat:"設定", t:"キャストごとの時給を入れる", k:"時給 じきゅう 給料 時間給 単価 人によって違う 昇給 上げる 1500 変える キャスト別 個別 いくら",
 h:`<p><b>⑤設定</b>タブ「キャスト登録」の一覧で、名前の隣の<b>時給の欄</b>に数字を入れる →
 <b>欄の外をクリック（タップ）すると保存</b>されます。</p>
 <ul>
   <li>人ごとに違う時給を入れられます（例：ママ 1,800円／Aさん 1,500円）</li>
   <li><b>欄を空にすると 1,500円</b>で計算（0円にはなりません）。新しく登録した人も、はじめから<b>1,500円</b></li>
   <li>時給分は<b>30分単位で切り捨て</b>（5時間20分なら5時間ぶん）。ここは全員共通</li>
 </ul>
 <div class="note ok"><b>締めた期間の給料は動きません。</b>
 時給を上げても、もう締めた前期・後期は<b>締めたときの時給のまま</b>。動くのは<b>まだ締めていない期間</b>だけ。<br>
 だから昇給は「締めの区切り（1日・16日）から」で入れてください。</div>
 <div class="note warn"><b>月の途中からの昇給は、いまはできません</b>
 （「◯月◯日から1,800円」のような日付の指定は、まだ作っていません）。
 月の途中で上げたいときは、この道具を作った人に伝えてください。</div>`},

{cat:"設定", t:"ママの売上ボーナスを設定する", k:"ボーナス ラダー 段 総売上 ママ 300万 達成 積み上がる",
 h:`<p>お店の<b>その月の総売上</b>が段（ラダー）に届いた日に、<b>その日の日当</b>にボーナスが乗ります。</p>
 <ol class="step">
   <li><b>⑤設定</b>タブの「👑 ママの売上ボーナス」で<b>もらう人</b>を選ぶ</li>
   <li><kbd>＋ 段を追加</kbd>で「総売上◯◯円 → ◯◯円」を入れる</li>
 </ol>
 <ul>
   <li><b>積み上がります</b>：300万・400万・500万と入れておけば、520万売れた月は<b>3つ全部</b>つく</li>
   <li><b>ママが休んでいる日に達成しても、その日に付きます</b>（お店の売上に対するものなので）</li>
   <li>月が変わったら、また1日から数え直し</li>
 </ul>
 <div class="note warn"><b>段が空のあいだ、ボーナスは1円も付きません。</b>

/* ============================================================
   描画・検索
   ★検索は「見出し＋別の言い方＋本文」を見る。
     本文はタグを外した文字だけにする（太字タグで切れて当たらなくなるのを防ぐ）。
   ============================================================ */
const strip = s => s.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
ITEMS.forEach((it,i)=>{ it.i=i; it.hay = (it.t+" "+it.k+" "+it.cat+" "+strip(it.h)).toLowerCase(); });

const CATS = [];
ITEMS.forEach(it=>{ if(CATS.indexOf(it.cat)<0) CATS.push(it.cat); });

let cat = "";            // 選んでいる分類（空＝すべて）
let open = {};           // 開いている項目
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 打った言葉を本文の中で光らせる。★タグの中は触らないこと（属性が壊れる） */
function hl(html, q){
  if(!q) return html;
  const parts = q.split(/\s+/).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!parts.length) return html;
  const re = new RegExp("("+parts.join("|")+")", "gi");
  return html.split(/(<[^>]+>)/).map(seg =>
    seg.charAt(0)==="<" ? seg : seg.replace(re, "<mark>$1</mark>")).join("");
}

function renderCats(){
  const box = document.getElementById("cats");
  box.innerHTML = ['<button class="chip'+(cat===""?" on":"")+'" data-c="">すべて</button>']
    .concat(CATS.map(c=>'<button class="chip'+(cat===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'))
    .join("");
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ cat=b.dataset.c; render(); });
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const words = q.split(/\s+/).filter(Boolean);
  const hits = ITEMS.filter(it=>{
    if(cat && it.cat!==cat) return false;
    return words.every(w=>it.hay.indexOf(w)>=0);     // 打った言葉が全部入っているもの
  });

  document.getElementById("hit").textContent =
    q ? ("「"+document.getElementById("q").value.trim()+"」… "+hits.length+"件") :
    (cat ? cat+"　"+hits.length+"件" : ITEMS.length+"項目");

  const list = document.getElementById("list");
  if(!hits.length){
    list.innerHTML = '<div class="empty">見つかりませんでした。<br>'
      + '別の言い方で探してみてください（例：<b>締め</b>／<b>原価</b>／<b>間違えた</b>）。<br><br>'
      + 'それでも出てこないことは、そのまま聞いてください。ここに足します。</div>';
    return;
  }
  /* ★検索したときは中身も開く（絞り込んだのに見出しだけ並ぶと二度手間になる）。
     1件だけのときは必ず開く。 */
  const auto = !!q;
  list.innerHTML = hits.map(it=>{
    const on = auto || open[it.i];
    return '<div class="item'+(on?" open":"")+'" data-i="'+it.i+'">'
      + '<button class="head" type="button"><span>'+hl(esc(it.t),q)+'</span><span class="arw">▶</span></button>'
      + '<div class="body"><span class="cat">'+esc(it.cat)+'</span>'+hl(it.h,q)+'</div></div>';
  }).join("");
  list.querySelectorAll(".item").forEach(el=>{
    el.querySelector(".head").onclick = ()=>{
      const i = +el.dataset.i;
      const nowOpen = el.classList.toggle("open");
      open[i] = nowOpen;
    };
  });
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("clear").onclick = ()=>{
  const q = document.getElementById("q");
  q.value = ""; cat = ""; open = {}; renderCats(); render(); q.focus();
};
renderCats();
render();

/* =========================================================================
   ★版チェック（2026-09-01 担当者さん「取説も自動で新しくなるように」）
   ★★道具本体（index.html）と**同じ仕組みのコピー**。直すときは両方直すこと。
     単体HTMLなので共通のファイルに切り出せない。

   なぜ要るか
     取説もURLを渡して読んでもらう。直したあと、読む人のブラウザが
     **前に見た版を10分ほど覚えている**ので、直したのに古いまま見えることがある。

   ★★版番号は**取説自身の中身**から作る（道具のハッシュではない）。
     道具のハッシュを使うと、**取説を直しても番号が変わらず気づかれない**し、
     逆に道具だけ直したときに取説まで読み込み直させてしまう。
     → ビルドが `manual-version.txt` に取説のハッシュを書く。

   ★無限リロードは絶対に起こさない
     置いてあるファイルが新しいのに、配られるHTMLが古いままの数分があり得る。
     素直に繰り返すと**取説が永久に開かなくなる**。読み込み直すのは1回だけ。
     それでも合わなければ細い帯を出すだけで、**読むことはできたまま**。
   ★sessionStorage のキーは道具と別にする。同じにすると、道具で1回読み込み直した記録が
     取説側の「もうやった」に化けて、取説が古いまま止まる。
   ★オフライン・圏外・ファイルが無い場合は何もしない（catch）。file:// でも何もしない。
   ========================================================================= */
const APP_VER  = "55fda276";
const VER_FILE = "manual-version-new.txt";
const VER_FLAG = "kyuyoManualReloadedFor";   // ★道具は kyuyoReloadedFor。別にする

/* 読み込み直すべきか。★fetchを含めないので、検査から直接ためせる */
function shouldReload(latest, current, flag){
  if(!latest || !current) return false;             // どちらか分からないなら触らない
  if(latest === current)  return false;             // 最新
  if(current === "__BUILD"+"_VER__") return false;  // ビルドを通していない開発中のファイル
  if(flag === latest)     return false;             // ★この版のために既に1回読み込み直している
  return true;
}
/* 飛び先。location.reload() ではなく**版番号つきURL**へ飛ぶ。
   ただの reload だと、ブラウザがまた同じ古いHTMLをキャッシュから出してくることがある。 */
function verUrl(href, ver){
  const u = href.split("#")[0].split("?")[0];
  return u + "?v=" + ver;
}
function verBar(){
  if(document.getElementById("verBar")) return;
  const d = document.createElement("div");
  d.id = "verBar";
  d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#c0392b;"
                  + "color:#fff;padding:8px 12px;font-size:13px;text-align:center";
  d.textContent = "新しい説明書が出ています。このページをいちど閉じて、開き直してください。";
  document.body.appendChild(d);
}
(function checkVersion(){
  if(location.protocol === "file:") return;
  if(APP_VER === "__BUILD"+"_VER__") return;   // ビルド前のファイルでは動かさない
  fetch(VER_FILE + "?t=" + Date.now(), {cache:"no-store"})
    .then(r => r.ok ? r.text() : null)
    .then(t => {
      if(t == null) return;
      const latest = String(t).trim().slice(0,64);
      let flag = null;
      try{ flag = sessionStorage.getItem(VER_FLAG); }catch(e){}
      if(latest === APP_VER){ try{ sessionStorage.removeItem(VER_FLAG); }catch(e){} return; }
      if(shouldReload(latest, APP_VER, flag)){
        try{ sessionStorage.setItem(VER_FLAG, latest); }catch(e){}
        location.replace(verUrl(location.href, latest));
      }else{
        verBar();     // 1回読み込み直しても合わなかった＝配られるHTMLがまだ古い
      }
    })
    .catch(()=>{});
})();
</script>
